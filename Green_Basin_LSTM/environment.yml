name: torch310env
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda        # enables GPU support — falls back to CPU automatically
  - ca-certificates
  - openssl
  - ipykernel
  - certifi
  - pandas
  - matplotlib
  - scikit-learn
  - conda
  - pip
  - pip:
    - sympy==1.13.1
    - dataretrieval     # USGS NWIS streamflow fetch
    - pydaymet          # Daymet climate data fetch
    - joblib            # scaler serialization
